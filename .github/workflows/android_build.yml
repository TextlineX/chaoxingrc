name: android_build

on:
  push:
    branches: [ "master", "beta" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. 环境准备
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 2. 提取版本号、日期并定义文件名
      - name: 设置版本变量
        id: vars
        run: |
          # 提取 pubspec.yaml 中的版本号 (例如 1.3.0)
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d '+' -f 1 | xargs)
          # 获取当前日期
          DATE=$(date +'%Y%m%d')
          # 定义最终文件名
          FILE_NAME="app-${{ github.ref_name }}-v${VERSION}-android-${DATE}.apk"
          
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "FILE_NAME=$FILE_NAME" >> $GITHUB_ENV

      # 3. 镜像加速与签名配置
      - name: 环境配置
        run: |
          sed -i 's/services.gradle.org\/distributions/mirrors.cloud.tencent.com\/gradle/g' android/gradle/wrapper/gradle-wrapper.properties
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
          echo "storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.SIGNING_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      # 4. 构建并重命名
      - name: 构建并重命名产物
        run: |
          flutter pub get
          flutter build apk --release --no-pub
          # 将原始产物移动并重命名
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/${{ env.FILE_NAME }}

      # 5. 暴力清理该分支对应的旧 Release 附件
      - name: 清理旧附件
        continue-on-error: true
        run: |
          RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" | jq -r '.id // empty')
          if [ ! -z "$RELEASE_ID" ]; then
            curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | \
              jq -r '.[].id' | xargs -I {} curl -s -X DELETE -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/{}"
          fi

      # 6. 发布 Release
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name == 'master' && '正式稳定版' || 'Beta 预览版' }} - v${{ env.VERSION }}
          prerelease: ${{ github.ref_name == 'beta' }}
          files: build/app/outputs/flutter-apk/${{ env.FILE_NAME }}
          generate_release_notes: false
          token: ${{ secrets.GITHUB_TOKEN }}